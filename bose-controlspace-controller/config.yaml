name: Bose ControlSpace Controller
version: "0.2.0"
slug: bose_controlspace_controller
description: MQTT bridge exposing Bose ControlSpace processors and PowerMatch amplifiers as Home Assistant devices
url: https://github.com/jacobgad/bose-control-space-controller
arch:
  - aarch64
  - amd64
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-multiple
map:
  - type: share
    read_only: false
options:
  poll_interval_ms: 2000
  write_debounce_ms: 300
  mode: bridge
  capture_dir: /share/bose/capture
  log_level: info
schema:
  poll_interval_ms: int(500,600000)
  write_debounce_ms: int(0,5000)
  mode: list(bridge|capture)
  capture_dir: str
  log_level: list(debug|info|warn|error)
